<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b7ff3c" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#b7ff3c" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#090b0a" stop-opacity="0" />
    </radialGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&amp;display=swap');
      .serif-p {
        font-family: 'DM Serif Display', Georgia, serif;
        font-size: 68px;
        fill: #b7ff3c;
      }
    </style>
  </defs>

  <!-- Dark Background -->
